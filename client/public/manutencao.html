<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>N1 Soluções — Em manutenção</title>
<!-- Shown by sw.js when the portal server cannot be reached. Everything is inline: nothing else may be available. -->
<style>
  :root { --bg: #f6f4ef; --card: #ffffff; --text: #171614; --muted: #6b665c; --gold: #b8964a; --line: #e4ded1; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0e0e0d; --card: #171614; --text: #f2efe8; --muted: #a39d90; --gold: #c9ad66; --line: #2a2825; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { width: 100%; max-width: 440px; padding: 36px 28px; border: 1px solid var(--line); border-radius: 18px; background: var(--card); text-align: center; }
  img { height: 52px; width: auto; border-radius: 6px; }
  .icon { width: 56px; height: 56px; margin: 26px auto 18px; display: grid; place-items: center; border-radius: 50%; background: color-mix(in srgb, var(--gold) 16%, transparent); color: var(--gold); }
  h1 { margin: 0 0 10px; font-size: 22px; font-weight: 650; }
  p { margin: 0 0 12px; color: var(--muted); font-size: 15px; line-height: 1.55; }
  button { margin-top: 10px; padding: 11px 22px; border: 0; border-radius: 10px; background: var(--gold); color: #171614; font: 600 15px system-ui, sans-serif; cursor: pointer; }
  small { display: block; margin-top: 14px; color: var(--muted); font-size: 12.5px; }
</style>
</head>
<body>
<main>
  <img src="/n1-logo.png" alt="N1 Soluções">
  <div class="icon" aria-hidden="true">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
  </div>
  <h1>Estamos em manutenção</h1>
  <p>O portal da N1 Soluções está passando por uma manutenção rápida. Seus dados e o andamento do seu processo estão seguros.</p>
  <p>Esta página volta sozinha assim que tudo estiver pronto.</p>
  <button type="button" id="retry">Tentar agora</button>
  <small id="note">Verificando de novo a cada 20 segundos.</small>
</main>
<script>
  // Back to the portal as soon as the server answers and is not in maintenance.
  async function check() {
    try {
      const res = await fetch("/api/trpc/status.manutencao", { cache: "no-store" });
      if (!res.ok) return;
      const body = await res.json();
      if (body && body.result && body.result.data && body.result.data.json && body.result.data.json.manutencao === false) location.reload();
    } catch (error) { /* still offline */ }
  }
  document.getElementById("retry").addEventListener("click", function () {
    document.getElementById("note").textContent = "Verificando...";
    check().then(function () { document.getElementById("note").textContent = "Ainda em manutenção. Verificando de novo a cada 20 segundos."; });
  });
  setInterval(check, 20000);
</script>
</body>
</html>
